name: CI Quality And Security

permissions:
  actions: read
  contents: read
  packages: write
  security-events: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  quality:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run lint, build and duplication checks
        run: npm run lint && npm run build && npm run jscpd

      - name: Upload quality reports
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: quality-reports
          path: |
            reports/jscpd
          if-no-files-found: ignore

  semgrep:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: npm ci

      - name: Install Semgrep
        run: python3 -m pip install --upgrade pip semgrep

      - name: Run Semgrep with OWASP Top 10 and architecture rules
        run: npm run semgrep:ci

      - name: Detect GitHub code scanning availability
        id: code-scanning
        if: always() && github.actor != 'nektos/act' && hashFiles('semgrep.sarif') != '' && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false)
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        with:
          script: |
            try {
              const { data: repo } = await github.rest.repos.get({
                owner: context.repo.owner,
                repo: context.repo.repo,
              });

              const security = repo.security_and_analysis ?? {};
              const enabled = Object.values(security).some(
                (feature) => feature && typeof feature === 'object' && feature.status === 'enabled',
              );

              core.setOutput('enabled', enabled ? 'true' : 'false');

              if (!enabled) {
                core.notice('Skipping SARIF upload because code scanning is not enabled for this repository.');
              }
            } catch (error) {
              core.warning(`Unable to determine code scanning status: ${error.message}`);
              core.setOutput('enabled', 'false');
            }

      - name: Upload Semgrep SARIF
        if: always() && steps.code-scanning.outputs.enabled == 'true'
        continue-on-error: true
        uses: github/codeql-action/upload-sarif@cdf488f595d80d6e07e03d4674febd5ab45fa938 # v4.37.9
        with:
          sarif_file: semgrep.sarif

      - name: Upload Semgrep reports
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: semgrep-reports
          path: |
            semgrep.sarif
          if-no-files-found: ignore

  e2e-admin:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Run admin E2E tests
        run: >-
          npx playwright test
          e2e/admin-api-connection.spec.ts
          e2e/admin-company-registration.spec.ts
          e2e/admin-fee-rules.spec.ts

      - name: Upload admin E2E reports
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-admin-reports
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  e2e-core:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Install Playwright browsers
        run: npx playwright install --with-deps chromium

      - name: Setup Supabase CLI
        uses: supabase/setup-cli@ab058987d8d6c725971f6cf9d0b5c98467e30bd1 # v1.7.1
        with:
          version: "1.7.1"

      - name: Start local Supabase
        run: supabase start --exclude imgproxy,pooler

      - name: Capture local Supabase connection details
        run: supabase status -o env >> "$GITHUB_ENV"

      - name: Reset database (apply migrations)
        run: supabase db reset

      - name: Run pgTAP database tests
        run: supabase test db

      - name: Provision E2E users
        env:
          E2E_SUPABASE_URL: ${{ env.API_URL }}
          E2E_SUPABASE_SERVICE_ROLE_KEY: ${{ env.SERVICE_ROLE_KEY }}
        run: sh scripts/provision-e2e-users.sh

      - name: Run core E2E tests
        env:
          E2E_SUPABASE_URL: ${{ env.API_URL }}
          E2E_SUPABASE_PUBLISHABLE_KEY: ${{ env.PUBLISHABLE_KEY }}
        run: >-
          npx playwright test
          e2e/auth-guards.spec.ts
          e2e/closed-group-messaging.spec.ts
          e2e/customer-seed.spec.ts
          e2e/customer-view.spec.ts
          e2e/side-panel.spec.ts
          e2e/message-utils.spec.ts

      - name: Stop local Supabase
        if: always()
        run: supabase stop

      - name: Upload core E2E reports
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: e2e-core-reports
          path: |
            playwright-report
            test-results
          if-no-files-found: ignore

  docker-zap:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build Docker image
        run: npm run docker:build:ci

      - name: Start container for OWASP scan
        run: |
          docker run -d --rm --name xchat-ci -p 127.0.0.1::8080 xchat:ci
          host_port=$(docker port xchat-ci 8080/tcp | sed 's/.*://')
          echo "XCHAT_HOST_PORT=$host_port" >> "$GITHUB_ENV"

      - name: Wait for application
        run: |
          for attempt in {1..20}; do
            if curl --fail --silent "http://127.0.0.1:$XCHAT_HOST_PORT" > /dev/null; then
              exit 0
            fi
            sleep 3
          done
          echo "Application did not become ready in time" >&2
          exit 1

      - name: Run OWASP ZAP baseline scan
        run: |
          mkdir -p reports/zap
          chmod 777 reports/zap
          docker run --rm --network host -v "$PWD/reports/zap:/zap/wrk/:rw" ghcr.io/zaproxy/zaproxy:stable \
            zap-baseline.py -I -t "http://127.0.0.1:$XCHAT_HOST_PORT" -m 3 -r zap-report.html -J zap-report.json

      - name: Stop container
        if: always()
        run: docker stop xchat-ci || true

      - name: Upload ZAP reports
        if: always() && github.actor != 'nektos/act'
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: zap-reports
          path: |
            reports/zap
          if-no-files-found: ignore

  ghcr-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs:
      - quality
      - semgrep
      - e2e-admin
      - e2e-core
      - docker-zap
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push GHCR image
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          push: true
          platforms: linux/amd64
          tags: |
            ghcr.io/${{ github.repository }}:latest
            ghcr.io/${{ github.repository }}:${{ github.sha }}
